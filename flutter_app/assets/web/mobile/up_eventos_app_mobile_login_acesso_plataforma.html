</head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary pt-safe pb-safe"><main class="flex-1 w-full bg-surface min-h-screen flex flex-col"><div class="flex flex-col w-full px-margin-mobile pb-space-2xl">

</div>
<div class="absolute -bottom-1 -right-1 w-7 h-7 rounded-full bg-surface-container-high flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-primary text-body-sm" style="font-variation-settings: 'FILL' 1;">arrow_back_ios_new</span>
</div>
</div>
<!-- Brand Tagline -->
<span class="mt-space-sm font-label-caps text-label-caps text-primary tracking-widest uppercase text-center opacity-90">
        CELEBRE • CONECTE • VIVA MOMENTOS
      </span>
</div>
<!-- Header Typography -->
<div class="text-center w-full max-w-sm mb-space-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight mb-space-xxs">
        Acesse sua conta
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
        Entre para acompanhar seus eventos e orçamentos exclusivos.
      </p>
</div>
<!-- Segmented Tab Switcher (Pill Style) -->
<div class="w-full max-w-sm bg-surface-container-lowest p-1.5 rounded-xl flex items-center justify-between mb-space-lg shadow-inner">
<button class="flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all duration-300 text-on-primary-fixed bg-surface-container-high shadow-md text-center" id="tab-login" onclick="switchAuthMode('login')" type="button">
        Entrar
      </button>
<button class="flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all duration-300 text-on-surface-variant text-center" id="tab-register" onclick="switchAuthMode('register')" type="button">
        Criar conta
      </button>
</div>
<!-- Main Container Card -->
<div class="w-full max-w-sm bg-surface-container rounded-2xl p-space-lg shadow-2xl flex flex-col gap-space-md">
<!-- Social Sign-In Triggers -->
<div class="grid grid-cols-2 gap-space-xs">
<button class="flex items-center justify-center gap-space-xs py-2.5 px-space-xs bg-surface-container-high rounded-xl text-on-surface font-label-md text-label-md active:scale-95 transition-transform" type="button">
<svg class="w-4 h-4 text-primary shrink-0" fill="currentColor" viewbox="0 0 24 24">
<path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"></path>
</svg>
<span class="truncate">Google</span>
</button>
<button class="flex items-center justify-center gap-space-xs py-2.5 px-space-xs bg-surface-container-high rounded-xl text-on-surface font-label-md text-label-md active:scale-95 transition-transform" type="button">
<svg class="w-4 h-4 text-on-surface shrink-0" fill="currentColor" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.84c.64-.78 1.08-1.86.96-2.95-1 .04-2.13.68-2.77 1.46-.57.66-.99 1.77-.86 2.83 1.1.08 2.05-.58 2.67-1.34z"></path>
</svg>
<span class="truncate">Apple</span>
</button>
</div>
<!-- Divider Strip -->
<div class="relative flex items-center justify-center my-space-xxs">
<div class="w-full h-px bg-surface-variant"></div>
<span class="absolute px-space-sm bg-surface-container font-label-caps text-label-caps text-outline uppercase tracking-wider">
          OU USE SEU E-MAIL
        </span>
</div>
<!-- Credential Form -->
<form class="flex flex-col gap-space-sm" onsubmit="event.preventDefault(); triggerAuth();">
<!-- Input: E-mail -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="email">
<span>E-mail</span>
<span class="font-body-sm text-body-sm text-primary opacity-80">Principal</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-title-md pointer-events-none">
              mail
            </span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md pl-11 pr-4 py-3 rounded-xl placeholder:text-outline-variant focus:outline-none focus:bg-surface-container-lowest transition-colors shadow-inner" id="email" placeholder="voce@exemplo.com" required="" type="email"/>
</div>
</div>
<!-- Input: Senha -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">
            Senha
          </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-title-md pointer-events-none">
              lock
            </span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md pl-11 pr-11 py-3 rounded-xl placeholder:text-outline-variant focus:outline-none focus:bg-surface-container-lowest transition-colors shadow-inner" id="password" minlength="6" placeholder="Mínimo de 6 caracteres" required="" type="password"/>
<button class="absolute right-3 text-outline hover:text-on-surface transition-colors p-1" id="toggle-pwd-btn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-title-md" id="toggle-pwd-icon">
                visibility
              </span>
</button>
</div>
</div>
<!-- Submit CTA with Satin Gold Gradient -->
<button class="mt-space-xs w-full py-3.5 px-space-md rounded-xl font-title-md text-title-md text-on-primary bg-gradient-to-r from-primary-container via-primary to-secondary shadow-lg active:opacity-95 transition-all duration-200 flex items-center justify-center gap-space-xs" id="submit-auth-btn" type="submit">
<span>Entrar na plataforma</span>
<span class="material-symbols-outlined text-title-md">arrow_forward</span>
</button>
</form>
<!-- Forgot Password Link -->
<div class="text-center pt-space-xxs">
<button class="font-label-md text-label-md text-primary hover:underline transition-all inline-flex items-center gap-1" type="button">
<span>Esqueci minha senha</span>
</button>
</div>
</div>
<!-- Feedback Banner / Toast Simulation -->
<div class="w-full max-w-sm mt-space-sm hidden rounded-xl bg-surface-container-high p-space-sm shadow-md flex items-center gap-space-xs text-on-surface animate-fade" id="auth-alert">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<p class="font-body-sm text-body-sm" id="auth-alert-text">Autenticação efetuada com sucesso!</p>
</div>
<!-- Educational Demo Notice & Public Backlink -->
<div class="w-full max-w-sm mt-space-lg flex flex-col items-center text-center gap-space-md">
<!-- Notice Chip -->
<div class="flex items-center gap-2 px-space-sm py-2 rounded-full bg-surface-container-lowest shadow-sm">
<span class="material-symbols-outlined text-outline text-body-sm">devices</span>
<span class="font-body-sm text-body-sm text-outline">
          Demonstração escolar: a conta fica salva apenas neste dispositivo.
        </span>
</div>
<!-- Public Site Return Button -->
<button class="inline-flex items-center gap-space-xs text-on-surface-variant font-label-md text-label-md hover:text-primary transition-colors py-1 px-space-sm" type="button">
<span class="material-symbols-outlined text-body-md">arrow_back</span>
<span>Voltar ao site público</span>
</button>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    const pwdIcon = document.getElementById('toggle-pwd-icon');
    if (!pwdInput || !pwdIcon) return;

    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      pwdIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      pwdIcon.textContent = 'visibility';
    }
  }

  function switchAuthMode(mode) {
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const submitBtn = document.getElementById('submit-auth-btn');

    if (!tabLogin || !tabRegister || !submitBtn) return;

    if (mode === 'register') {
      tabRegister.className = 'flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all duration-300 text-on-primary-fixed bg-surface-container-high shadow-md text-center';
      tabLogin.className = 'flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all duration-300 text-on-surface-variant text-center';
      submitBtn.querySelector('span:first-child').textContent = 'Cadastrar minha conta';
    } else {
      tabLogin.className = 'flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all duration-300 text-on-primary-fixed bg-surface-container-high shadow-md text-center';
      tabRegister.className = 'flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all duration-300 text-on-surface-variant text-center';
      submitBtn.querySelector('span:first-child').textContent = 'Entrar na plataforma';
    }
  }

  function triggerAuth() {
    const alertBox = document.getElementById('auth-alert');
    const email = document.getElementById('email');
    if (!alertBox || !email) return;

    alertBox.classList.remove('hidden');
    document.getElementById('auth-alert-text').textContent = 'Conectando sessão para ' + email.value + '...';

    setTimeout(() => {
      alertBox.classList.add('hidden');
    }, 3500);
  }
</script></main></body></html>
